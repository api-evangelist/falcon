openapi: 3.0.0
info:
  title: Fee APIs
  description: APIs to manage fees and charges in the credit card lifecycle.
  version: 1.0.0
servers:
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1
paths:
  /account/debit:
    post:
      security:
      - bearerAuth: []
      summary: Post a Fee
      description: Use this endpoint to post a fee to an account. Configured GST will be posted to the account automatically.
      operationId: post-fee
      parameters:
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accountId
              - feeType
              - amount
              - narration
              properties:
                accountId:
                  type: string
                  description: ID of the account to be debited.
                  example: '202000004782'
                feeType:
                  type: string
                  description: Type of fee to be debited.
                  example: Reward Redemption Fee
                amount:
                  type: string
                  description: Amount to be debited.
                  example: '200'
                narration:
                  type: string
                  description: Narration for the fee.
                  example: Annual fee for the card
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                example: {}
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /account/{accountId}/fees:
    get:
      security:
      - bearerAuth: []
      summary: Get the Fees of an Account
      description: Use this endpoint to fetch details of fees of an account.
      operationId: get-account-fees
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          description: ID of the account to be fetched.
          example: '12345'
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  joiningFee:
                    type: string
                    description: Joining fee for the card
                    example: '0'
                  joiningFeeTax:
                    type: string
                    description: Tax on joining fee
                    example: '0'
                  annualFee:
                    type: string
                    description: Annual fee of the card
                    example: '0'
                  annualFeeTax:
                    type: string
                    description: Tax on annual fee
                    example: '0'
                  latePaymentFee:
                    type: string
                    description: Late payment fee
                    example: '100'
                  latePaymentFeeTax:
                    type: string
                    description: Tax on late payment fee
                    example: '10'
                  cashAdvanceFee:
                    type: string
                    description: Cash advance fee
                    example: '0'
                  cashAdvanceFeeTax:
                    type: string
                    description: Tax on cash advance fee
                    example: '0'
                  overLimitFee:
                    type: string
                    description: Over limit fee
                    example: '100'
                  overLimitFeeTax:
                    type: string
                    description: Tax on over limit fee
                    example: '10'
                  cardReplacementFees:
                    type: string
                    description: Card replacement fee
                    example: '100'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /fee:
    post:
      security:
      - bearerAuth: []
      summary: Add a Fee Model
      description: Use this endpoint to create a new fee model with configurations approved by issuer.
      operationId: add-fee-model
      parameters:
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - feeModelID
              - feeModelName
              - cardType
              - cardCategory
              - cardSubCategory
              - cardProduct
              - cardBrand
              - cardNetwork
              properties:
                revolvingInterestRate:
                  type: string
                  description: Revolving interest rate for the card
                  example: 3.5%
                joiningFee:
                  type: integer
                  description: Joining fee for the card
                  example: 500
                annualFee:
                  type: integer
                  description: Annual fee of the card
                  example: 1000
                penalFee:
                  type: integer
                  description: Penal fee of the card
                  example: 200
                penalInterestRate:
                  type: string
                  description: Penal interest rate of the card
                  example: 2.5%
                cardReplacementFee:
                  type: string
                  description: Card replacement fee
                  example: '100'
                cashAdvanceFee:
                  type: string
                  description: Cash advance fee
                  example: 2%
                cashAdvanceInterestRate:
                  type: string
                  description: Cash advance interest rate
                  example: 3%
                latePaymentFee:
                  type: string
                  description: Late payment fee
                  example: '500'
                gst:
                  type: string
                  description: GST applicable on fees
                  example: 18%
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                example: {}
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /fee/post-fee:
    post:
      security:
      - bearerAuth: []
      summary: Post a Pending Fee
      description: Use this endpoint to post fee which is yet to be posted. This is only relevant for account closure purpose. Once this is posted, it should not be posted again for that reason. For example, If it is a overlimit fee which is to be charged once a month, it can only be charged in the next month if for any reason account is still not closed.
      operationId: post-pending-fee
      parameters:
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accountId
              properties:
                accountId:
                  type: string
                  description: ID of the account to be posted.
                  example: '202000004782'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  feetype:
                    type: string
                    description: Type of the fee posted
                    example: type
                  feeamount:
                    type: integer
                    description: Amount of the posted fee
                    example: 1000
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /fee/reverse:
    post:
      security:
      - bearerAuth: []
      summary: Reverse a Fee
      description: Use this endpoint to reverse either an already posted fee or interest, or post a fee or interest credit to an account.
      operationId: reverse-fee
      parameters:
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accountId
              - feeType
              - amount
              - narration
              properties:
                accountId:
                  type: string
                  description: ID of the account to be credited.
                  example: '202000004782'
                feeType:
                  type: string
                  description: Type of fee to be credited.
                  example: Reward Redemption Fee
                amount:
                  type: string
                  description: Amount to be credited.
                  example: '200'
                narration:
                  type: string
                  description: Narration for the fee.
                  example: Fees on cash advance
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                example: {}
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /fee/{accountId}:
    get:
      security:
      - bearerAuth: []
      summary: View Yet to be Posted Fee
      description: Use this endpoint to view fees that should be charged if a customer requests for account closure.
      operationId: get-yet-to-be-posted-fee
      parameters:
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          description: ID of the account to be fetched.
          example: '202000004782'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  feetype:
                    type: string
                    description: Type of fee applicable.
                    example: Annual Fee
                  feeamount:
                    type: number
                    description: Amount of fee applicable.
                    example: 1000
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /fee/{feeModelID}:
    get:
      security:
      - bearerAuth: []
      summary: View a Fee Model
      description: Use this endpoint to fetch details of fees and charges in a particular fee model.
      operationId: get-fee-model
      parameters:
      - name: feeModelID
        in: path
        required: true
        schema:
          type: string
          description: ID of the fee model to be fetched.
          example: '12345'
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  feeModelID:
                    type: string
                    description: ID of the fee model
                    example: '12345'
                  revolvingInterestRate:
                    type: string
                    description: Revolving interest rate for the card
                    example: 3.5%
                  joiningFee:
                    type: integer
                    description: Joining fee for the card
                    example: 500
                  annualFee:
                    type: integer
                    description: Annual fee of the card
                    example: 1000
                  penalFee:
                    type: integer
                    description: Penal fee of the card
                    example: 200
                  penalInterestRate:
                    type: string
                    description: Penal interest rate of the card
                    example: 2.5%
                  cardReplacementFee:
                    type: string
                    description: Card replacement fee
                    example: '100'
                  cashAdvanceFee:
                    type: string
                    description: Cash advance fee
                    example: 2%
                  cashAdvanceInterestRate:
                    type: string
                    description: Cash advance interest rate
                    example: 3%
                  latePaymentFee:
                    type: string
                    description: Late payment fee
                    example: '500'
                  gst:
                    type: string
                    description: GST applicable on fees
                    example: 18%
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
