openapi: 3.0.0
info:
  title: View a List of Enterprise Accounts
  description: Use this endpoint to fetch all credit acounts opened for an enterprise.
  version: 1.0.0
servers:
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1
paths:
  /account/{enterpriseID}:
    get:
      summary: View a List of Enterprise Accounts
      description: Use this endpoint to fetch all credit acounts opened for an enterprise.
      parameters:
      - name: enterpriseID
        in: path
        required: true
        schema:
          type: string
          description: The unique identifier of the enterprise.
          example: Wework
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  enterpriseID:
                    type: string
                    description: The unique identifier of the enterprise.
                    example: Wework
                  accountlist:
                    type: array
                    items:
                      type: object
                      properties:
                        accountId:
                          type: string
                          description: The unique identifier of the account.
                          example: '202000004780'
                        accountType:
                          type: string
                          description: The type of the account.
                          example: Domestic
                        programeID:
                          type: string
                          description: The unique program identifier for the account.
                          example: SFC01
                  total_count:
                    type: integer
                    description: Total number of accounts.
                    example: 1
