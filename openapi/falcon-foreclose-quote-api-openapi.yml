openapi: 3.2.0
info:
  title: EMI Foreclose Quote API
  description: APIs for managing EMI plans and transactions
  version: 1.0.0
servers:
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1
tags:
- name: Foreclose Quote
paths:
  /foreclose-quote:
    post:
      security:
      - bearerAuth: []
      summary: Foreclosure Quote
      description: Use this endpoint to view the details related to the foreclose quote.
      operationId: foreclosure-quote
      parameters:
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - EmiID
              properties:
                EmiID:
                  type: string
                  description: ID of the EMI plan for which to get the foreclosure quote.
                  example: 123asd
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  TransactionDetails:
                    type: array
                    description: Details of the transaction.
                    items:
                      type: object
                      properties:
                        TransactionID:
                          type: integer
                          description: ID of the transaction.
                          example: 36121312
                        TransactionDateTime:
                          type: string
                          description: Date and time of the transaction in DD/MM/YYYY HH:MM:SS format.
                          example: 23/03/2024 16:10:34
                        MerchantName:
                          type: string
                          description: Name of the merchant for the transaction.
                          example: Amazon
                        TransactionAmount:
                          type: number
                          description: Amount of the transaction.
                          example: 1000
                  LoanDetails:
                    type: object
                    description: Details of the loan.
                    properties:
                      InterestRate:
                        type: number
                        description: Interest rate for the loan.
                        example: 32
                      EMIAmount:
                        type: number
                        description: Amount of the EMI.
                        example: 216.28
                      TotalPrincipalAmount:
                        type: number
                        description: Total principal amount for the loan.
                        example: 1000
                      TotalInterestAmount:
                        type: number
                        description: Total interest amount for the loan.
                        example: 81.4
                      TotalInterestGST:
                        type: number
                        description: Total GST on interest for the loan.
                        example: 14.65
                      Status:
                        type: string
                        description: Status of the loan.
                        example: '{$status}'
                      CloseReason:
                        type: string
                        description: Reason for closing the loan.
                        example: '{$reason}'
                  ProcessingFee:
                    type: array
                    description: Details of the processing fee.
                    items:
                      type: object
                      properties:
                        ProcessingFee:
                          type: number
                          description: Amount of the processing fee.
                          example: 200
                        ProcessingFeeGST:
                          type: number
                          description: Amount of the GST on processing fee.
                          example: 35
                  ForeclosureRule:
                    type: array
                    description: Foreclosure rules for the loan.
                    items:
                      type: object
                      properties:
                        ForeclosureChargesType:
                          type: string
                          description: Type of foreclosure charges.
                          example: PercentageWithMinAndMax
                        Percentage:
                          type: number
                          description: Percentage of the foreclosure charges.
                          example: 16
                        MinAmount:
                          type: number
                          description: Minimum amount for the foreclosure charges.
                          example: 100
                        MaxAmount:
                          type: number
                          description: Maximum amount for the foreclosure charges.
                          example: 2000
                  TotalPayable:
                    type: number
                    description: Total amount payable for the loan.
                    example: 1096.06
                  LoanSchedules:
                    type: array
                    description: Details of the loan schedules.
                    items:
                      type: object
                      properties:
                        InstallmentNumber:
                          type: integer
                          description: Number of the installment.
                          example: 1
                        PrincipalAmount:
                          type: number
                          description: Amount of the principal for the installment.
                          example: 189.61
                        InterestAmount:
                          type: number
                          description: Amount of the interest for the installment.
                          example: 26.67
                        OutstandingBalance:
                          type: number
                          description: Outstanding balance after the installment.
                          example: 810.39
                        BillingDate:
                          type: string
                          description: Billing date for the installment in DD/MM/YYYY format.
                          example: 25/03/2024
                        Status:
                          type: string
                          description: Status of the installment.
                          example: '{$status}'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      tags:
      - Foreclose Quote
