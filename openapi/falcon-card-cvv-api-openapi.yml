openapi: 3.2.0
info:
  title: Credit Card Card Cvv API
  description: APIs for managing credit cards, including issuance, activation, limits, and transactions.
  version: 1.0.0
servers:
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1/
tags:
- name: Card Cvv
paths:
  /card-cvv/{cardId}:
    post:
      summary: View the CVV of a Card
      description: Use this endpoint to view the Card CVV.
      operationId: view-card-cvv
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the non-PCI card.
        example: 9824c2dc-65ac-417a-a11c-43e47e8dfa6t
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
        example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer {{access_token}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  encryptedCVV:
                    type: string
                    description: The encrypted CVV of the card.
                    example: /tRqpi3aVf41+nitzRrdTQ==
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized access
        '404':
          description: Account not found
      tags:
      - Card Cvv
