openapi: 3.2.0
info:
  title: Repayment FD API
  description: API endpoints for credit card repayments, including bill payments, reversals, auto-debit configurations, and payment status checks.
  version: 1.0.0
servers:
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1
tags:
- name: FD
paths:
  /FD/payment/PHONEPE/inquiry/order/{oderID}:
    get:
      security:
      - bearerAuth: []
      summary: Fetch Payment Status
      description: Use this endpoint to fetch the payment status.
      operationId: fetch-payment-status
      parameters:
      - name: oderID
        in: path
        required: true
        schema:
          type: string
        description: The ID of the order for the payment status.
        example: b3488889-5a07-48d5-99b4-fa963fdfbb02
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      - name: enterpriseId
        in: header
        required: true
        schema:
          type: string
          description: The ID of the enterprise.
          example: b3488889-5a07-48d5-99b4-fa963fdfbb02
        example: nonjit
      - name: userId
        in: header
        required: true
        schema:
          type: string
          description: The ID of the user.
          example: b3488889-5a07-48d5-99b4-fa963fdfbb02
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The status of the payment.
                    example: SUCCESS
                    enum:
                    - SUCCESS
                    - FAILURE
                    - PENDING
                  message:
                    type: string
                    description: The message for the payment status.
                    example: Your payment is successful
                  state:
                    type: string
                    description: The state of the payment.
                    example: PAYMENT_SUCCESS
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized request
      tags:
      - FD
