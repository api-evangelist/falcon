paths:
  /user:
    post:
      summary: Assign a Program to an User
      description: Use this endpoint to assign a program to an user.
      operationId: assign-user-program
      parameters:
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userID:
                  type: string
                  description: User ID of the user to whom the program is assigned.
                  format: uuid
                  example: 9824c2dc-65ac-417a-a11c-43e47e8dfa7a
                programId:
                  type: string
                  description: The unique ID of a program to be assigned.
                  example: SFCC01
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                example: {}
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
