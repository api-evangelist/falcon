      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  opt:
                    type: string
                    description: Indicates if auto-debit is enabled.
                    example: 'yes'
                  amountConfig:
                    type: string
                    description: Amount configuration type.
                    example: MAD
                  bank:
                    type: object
                    description: Bank details for the auto-debit configuration.
                    properties:
                      accountnumber:
                        type: string
                        description: The bank account number.
                        example: '12345678901'
                      Ifsc:
                        type: string
                        description: The IFSC of the bank.
                        example: HDFC00000056
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized request
  /user/repayment/postrepayment:
    post:
      security:
      - bearerAuth: []
      summary: Post Repayments
      description: Use this endpoint to post a repayment to a user's credit card account.
      operationId: post-repayment
      parameters:
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - bankName
              - accountId
              - paymentDate
              - currency
              - amount
              - referenceId
              properties:
                bankName:
                  type: string
                  description: The name of the bank of the repayment.
                  example: ICICI BANK
                accountId:
                  type: string
                  description: The ID of the account of the repayment.
                  example: ICICI BANK
                paymentDate:
                  type: string
                  description: The date of the payment.
                  example: '2021-05-15T18:14:55.000'
                currency:
                  type: string
                  description: The currency of the repayment.
                  example: INR
                amount:
                  type: number
                  description: The repayment amount.
                  format: float
                  example: 1000.5
                referenceId:
                  type: string
                  description: The reference ID for the repayments.
                  example: e6ef5e95-2bab-4ec2-a7cc-4d2bbd9840ab
                paymentSource:
                  type: string
                  description: The source of the payment.
                  example: DEBIT_CARD
                sourceAccount:
                  type: integer
                  description: The source account number for the repayments.
                  example: 1000109
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                example: {}
        '400':
          description: Invalid request parameters
        '401':
          description: Unauthorized request
