openapi: 3.2.0
info:
  title: Falcon Program API
  version: 1.0.0
  description: 'Operations tagged Program across 6 of this provider''s published API definitions: falcon-add-a-program-openapi.yml, falcon-create-a-program-due-date-openapi.yml, falcon-get-program-due-dates-openapi.yml, falcon-program-configuration-honor-openapi.yml, falcon-view-a-program-openapi.yml, falcon-emi-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1/
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1
tags:
- name: Program
paths:
  /program:
    post:
      security:
      - bearerAuth: []
      summary: Add a Program
      description: Use this endpoint to add a new program.
      operationId: add-program
      parameters:
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - issuerName
              - productCategories
              - product
              - productVariant
              - program
              - startDate
              - endDate
              - binValue
              - binRangeStart
              - binRangeEnd
              - countryCode
              - currencyCode
              - timeZone
              - dueDate
              - duration
              - emailCongif
              - cardFormFactor
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Program
    servers:
    - url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1/
  /program/{programId}/due-dates:
    post:
      summary: Create a Program Due date
      description: Use this endpoint to create a due date for a program.
      operationId: create-duedate
      parameters:
      - name: programId
        in: path
        required: true
        schema:
          type: string
          description: The unique identifier of the program.
          example: e4328fbe-db7b-4b7a-9b38-912b0e05a849
      - in: header
        name: x-tenant-id
        schema:
          type: string
        required: true
        example: falcon
      - in: header
        name: Authorization
        schema:
          type: string
        required: true
        example: Bearer {access_token}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - day
              - active
              properties:
                day:
                  type: integer
                  description: Day of the month for the due date.
                  example: 17
                active:
                  type: boolean
                  description: Indicates if the due date is active.
                  enum:
                  - true
                  - false
                  example: true
      responses:
        '200':
          description: Due date assigned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  programDueDateId:
                    type: integer
                    description: The unique identifier for the program due date.
                    example: 16631
                  programId:
                    type: string
                    description: The unique identifier for the program.
                    example: e4328fbe-db7b-4b7a-9b38-912b0e05a849
                  day:
                    type: integer
                    description: The day of the month for the due date.
                    example: 17
                  active:
                    type: boolean
                    description: Indicates if the due date is active.
                    enum:
                    - true
                    - false
                    example: true
                  existsAccount:
                    type: boolean
                    description: Indicates if the account exists.
                    enum:
                    - true
                    - false
                    example: false
        '400':
          description: Invalid request parameters.
        '401':
          description: Unauthorized access.
        '500':
          description: Internal server error.
      tags:
      - Program
    get:
      summary: Get Program Due Dates
      description: Use this endpoint to fetch due dates of a program.
      operationId: get-program-duedates
      parameters:
      - name: programId
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier for the credit card program.
        example: e4328fbe-db7b-4b7a-9b38-912b0e05a849
      - name: day
        in: query
        required: false
        schema:
          type: integer
        description: The day of the month for which to retrieve due dates.
        example: 18
      - name: pageNo
        in: query
        required: false
        schema:
          type: integer
        description: The page number for pagination.
        example: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
        description: The number of items per page for pagination.
        example: 3
      - in: header
        name: x-tenant-id
        schema:
          type: string
        required: true
        example: falcon
      - in: header
        name: Authorization
        schema:
          type: string
        required: true
        example: Bearer {access_token}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  dueDates:
                    type: array
                    description: List of due dates for the program.
                    items:
                      type: object
                  hasNextElement:
                    type: boolean
                    description: Indicates if there are more elements to fetch.
                    example: false
        '400':
          description: Invalid request parameters.
        '401':
          description: Unauthorized access.
        '500':
          description: Internal server error.
      tags:
      - Program
    servers:
    - url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1/
  /program/{programId}/config:
    post:
      summary: Program Configuration Honor
      description: Use this endpoint to program config honor.
      operationId: program-config-honor
      parameters:
      - name: programId
        in: path
        required: true
        schema:
          type: string
          description: The unique identifier for the credit card program.
          example: '12345'
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
        example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          format: bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cashAdvanceFee:
                  $ref: '#/components/schemas/FeeWaiver'
                annualFee:
                  $ref: '#/components/schemas/FeeWaiver'
                cardReplacementFee:
                  $ref: '#/components/schemas/FeeWaiver'
                fuelSurcharge:
                  $ref: '#/components/schemas/FeeWaiver'
                internationalPurchase:
                  $ref: '#/components/schemas/FeeWaiver'
                internationalWithdrawal:
                  $ref: '#/components/schemas/FeeWaiver'
                internationalWithdrawalMarkup:
                  $ref: '#/components/schemas/FeeWaiver'
                emiProcessingFee:
                  $ref: '#/components/schemas/FeeWaiver'
                emiForeClosureFee:
                  $ref: '#/components/schemas/FeeWaiver'
                rentalFee:
                  $ref: '#/components/schemas/FeeWaiver'
                latePaymentFee:
                  $ref: '#/components/schemas/FeeWaiver'
                rewardRedemption:
                  $ref: '#/components/schemas/FeeWaiver'
                overLimitFee:
                  $ref: '#/components/schemas/FeeWaiver'
                transactionCategories:
                  type: array
                  items:
                    $ref: '#/components/schemas/TransactionCategory'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                example: {}
                additionalProperties: false
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Program
    servers:
    - url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1/
  /program/{programId}:
    get:
      summary: View a Program
      description: Use this endpoint to fetch details of a program.
      operationId: view-program-details
      parameters:
      - name: programId
        in: path
        required: true
        schema:
          type: string
          example: SFCC01
          description: The unique ID of the program you want to see the details.
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  programeID:
                    type: string
                    description: The unique program ID.
                    example: SFCC01
                  issuerName:
                    type: string
                    description: The name of the issuer.
                    example: Shivalik
                  productCategories:
                    type: string
                    description: The categories of the product.
                    example: Credit
                  product:
                    type: string
                    description: The name of the product.
                    example: Commercial Credit Card
                  productVariant:
                    type: string
                    description: The variant of the product.
                    example: Shivalik Falcon Credit Card
                  program:
                    type: string
                    description: The name of the program.
                    example: Classic Credit Card
                  startDate:
                    type: string
                    description: The start date of the program.
                    example: '2023-01-01T00:00:00.000Z'
                  endDate:
                    type: string
                    description: The end date of the program.
                    example: '2023-12-31T00:00:00.000Z'
                  binValue:
                    type: string
                    description: The bin value of the program.
                    example: 123456
                  binRangeStart:
                    type: string
                    description: The start of the bin range.
                    example: 123456
                  binRangeEnd:
                    type: string
                    description: The end of the bin range.
                    example: 123459
                  countryCode:
                    type: string
                    description: The country code of the program.
                    example: IN
                  currencyCode:
                    type: string
                    description: The currency code of the program.
                    example: INR
                  timeZone:
                    type: string
                    description: The time zone of the program.
                    example: Asia/Kolkata
                  dueDate:
                    type: string
                    description: The due date of the program.
                    example: '2023-01-15T00:00:00.000Z'
                  duration:
                    type: string
                    description: The duration of the program.
                    example: 12 months
                  revolvingInterestRate:
                    type: string
                    description: The revolving interest rate of the program.
                    example: 1.5%
                  joiningFee:
                    type: string
                    description: The joining fee of the program.
                    example: 500
                  annualFee:
                    type: string
                    description: The annual fee of the program.
                    example: 1000
                  penalFee:
                    type: string
                    description: The penal fee of the program.
                    example: 200
                  penalInterestRate:
                    type: string
                    description: The penal interest rate of the program.
                    example: 2%
                  cardReplacementFee:
                    type: string
                    description: The card replacement fee of the program.
                    example: 300
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Program
    servers:
    - url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1
  /program/{programID}/add-emi-plan:
    post:
      security:
      - bearerAuth: []
      summary: Add a New EMI Plan
      description: Use this endpoint to create a new EMI plan.
      operationId: add-emi-plan
      parameters:
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      - name: programID
        in: path
        required: true
        schema:
          type: string
          description: The ID of the program to which the EMI plan belongs.
          example: programID123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - EmiPlanID
              - StartDate
              - EndDate
              - Status
              - ProgramID
              - Description
              - EmiCalculationType
              - TransactionEligibility
              - ProcessingFee
              - EmiSchedulesRules
              - Foreclosure
              - CoolingDays
              - RefundProcessingFeeDays
              properties:
                StartDate:
                  type: string
                  description: Start date of the EMI plan in YYYY-MM-DD format.
                  example: '2023-01-01'
                EndDate:
                  type: string
                  description: End date of the EMI plan in YYYY-MM-DD format.
                  example: '2023-12-31'
                Status:
                  type: string
                  description: Status of the EMI plan.
                  example: active
                  enum:
                  - active
                  - inactive
                ProgramID:
                  type: string
                  description: The ID of the program to which the EMI plan belongs.
                  example: programID123
                Description:
                  type: string
                  description: Description of the EMI plan.
                  example: Monthly EMI plan for electronics
                EmiCalculationType:
                  type: string
                  description: Type of EMI calculation.
                  example: monthly
                  enum:
                  - monthly
                  - daily
                TransactionEligibility:
                  type: object
                  required:
                  - TransactionCountAllowedPerRequest
                  - AllowedTransactionAge
                  - AllowBilledTransaction
                  - TransactionCategory
                  description: Transaction eligibility criteria for the EMI plan.
                  properties:
                    TransactionCountAllowedPerRequest:
                      type: integer
                      description: Maximum number of transactions allowed per request.
                      example: 5
                    AllowedTransactionAge:
                      type: integer
                      description: Maximum age of transactions allowed for EMI.
                      example: 30
                    AllowBilledTransaction:
                      type: boolean
                      description: Whether billed transactions are allowed.
                      example: true
                      enum:
                      - true
                      - false
                    TransactionCategory:
                      type: array
                      description: List of transaction categories allowed for EMI.
                      items:
                        type: object
                        properties:
                          CategoryName:
                            type: string
                            description: Name of the transaction category.
                            example: electronics
                          Rules:
                            type: array
                            description: Rules for the transaction category.
                            items:
                              type: object
                              properties:
                                Key:
                                  type: string
                                  description: Key for the rule.
                                  example: maxAmount
                                Comparison:
                                  type: string
                                  description: Comparison operator for the rule.
                                  example: greaterThan
                                Value:
                                  type: array
                                  description: Values for the rule.
                                  items:
                                    type: string
                                    description: Value for the rule.
                                    example: '1000'
                                Action:
                                  type: string
                                  description: Action to take if the rule is met.
                                  example: approve
                ProcessingFee:
                  type: object
                  required:
                  - Type
                  - Percentage
                  - MinAmount
                  - MaxAmount
                  description: Processing fee details for the EMI plan.
                  properties:
                    Type:
                      type: string
                      description: Type of processing fee.
                      example: PercentageWithMinAndMax
                    Percentage:
                      type: number
                      description: Percentage of the processing fee.
                      example: 2.5
                    MinAmount:
                      type: number
                      description: Minimum amount for the processing fee.
                      example: 100
                    MaxAmount:
                      type: number
                      description: Maximum amount for the processing fee.
                      example: 500
                EmiSchedulesRules:
                  type: array
                  description: Rules for EMI schedules.
                  items:
                    type: object
                    properties:
                      Month:
                        type: integer
                        description: Month number for the EMI schedule.
                        example: 1
                      Interest:
                        type: number
                        description: Interest rate for the EMI schedule.
                        example: 1.5
                      MinAmount:
                        type: number
                        description: Minimum amount for the EMI schedule.
                        example: 1000
                      MaxAmount:
                        type: number
                        description: Maximum amount for the EMI schedule.
                        example: 5000
                Foreclosure:
                  type: object
                  required:
                  - Allowed
                  - RemoveForeclosureMonthInterest
                  - ForeclosureInterestCalculationType
                  - ForeclosureCharges
                  description: Foreclosure details for the EMI plan.
                  properties:
                    Allowed:
                      type: boolean
                      description: Whether foreclosure is allowed.
                      example: true
                      enum:
                      - true
                      - false
                    RemoveForeclosureMonthInterest:
                      type: boolean
                      description: Whether to remove foreclosure month interest.
                      example: true
                      enum:
                      - true
                      - false
                    ForeclosureInterestCalculationType:
                      type: string
                      description: Type of foreclosure interest calculation.
                      example: monthly
                      enum:
                      - monthly
                    ForeclosureCharges:
                      type: object
                      required:
                      - Type
                      - Percentage
                      - MinAmount
                      - MaxAmount
                      description: Foreclosure charges details.
                      properties:
                        Type:
                          type: string
                          description: Type of foreclosure charges.
                          example: PercentageWithMinAndMax
                        Percentage:
                          type: number
                          description: Percentage of the foreclosure charges.
                          example: 2
                        MinAmount:
                          type: number
                          description: Minimum amount for the foreclosure charges.
                          example: 200
                        MaxAmount:
                          type: number
                          description: Maximum amount for the foreclosure charges.
                          example: 1000
                CoolingDays:
                  type: integer
                  description: Number of cooling days for the EMI plan.
                  example: 5
                RefundProcessingFeeDays:
                  type: integer
                  description: Number of days for refund processing fee.
                  example: 10
                forceClosureDpdDays:
                  type: integer
                  description: Number of days for force closure DPD.
                  example: 30
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: string
                    description: Status of the response.
                    example: success
                  EmiPlanID:
                    type: string
                    description: ID of the EMI plan.
                    example: emiPlanID123
                  Code:
                    type: string
                    description: Response code.
                    example: '200'
                  CodeDescription:
                    type: string
                    description: Description of the response code.
                    example: EMI plan created successfully
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      tags:
      - Program
    servers:
    - url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1
components:
  schemas:
    ProductResponse:
      type: object
      properties:
        issuerName:
          type: string
          description: The name of the issuer.
          example: Shivalik
        productCategories:
          type: string
          description: The categories of the product.
          example: Credit
        product:
          type: string
          description: The name of the product.
          example: Commercial Credit Card
        productVariant:
          type: string
          description: The variant of the product.
          example: Shivalik Falcon Credit Card
        program:
          type: string
          description: The name of the program.
          example: Classic Credit Card
        programeID:
          type: string
          description: The ID of the program.
          example: SFCC01
    ProductRequest:
      type: object
      properties:
        issuerName:
          type: string
          description: The name of the issuer.
          example: Shivalik
        productCategories:
          type: string
          description: The categories of the product.
          example: Credit
        product:
          type: string
          description: The name of the product.
          example: Commercial Credit Card
        productVariant:
          type: string
          description: The variant of the product.
          example: Shivalik Falcon Credit Card
        program:
          type: string
          description: The name of the program.
          example: Classic Credit Card
        startDate:
          type: string
          description: The start date of the program.
          example: '2023-01-01'
        endDate:
          type: string
          description: The end date of the program.
          example: '2023-12-31'
        binValue:
          type: string
          description: The bin value of the card.
          example: '123456'
        binRangeStart:
          type: string
          description: The start of the bin range.
          example: '123456'
        binRangeEnd:
          type: string
          description: The end of the bin range.
          example: '123459'
        countryCode:
          type: string
          description: The country code.
          example: IN
        currencyCode:
          type: string
          description: The currency code.
          example: INR
        timeZone:
          type: string
          description: The time zone.
          example: Asia/Kolkata
        dueDate:
          type: string
          description: The due date of the program.
          example: '2023-01-01'
        duration:
          type: string
          description: The duration of the program.
          example: 12 months
        emailCongif:
          type: string
          description: The email configuration.
        cardFormFactor:
          type: string
          description: The form factor of the card.
          example: Virtual
    FeeWaiver:
      type: object
      properties:
        fee:
          $ref: '#/components/schemas/Fee'
        waiver:
          $ref: '#/components/schemas/Waiver'
    Fee:
      type: object
      properties:
        feeModelType:
          type: string
          description: The type of fee model.
          enum:
          - FIXED
          - PERCENTAGE
          - GREATER
          - TIERED
        fixedAmount:
          type: string
          description: The fixed amount for the fee.
          example: '100'
        percentValue:
          type: string
          description: The percentage value for the fee.
          example: '5'
        startRange:
          type: string
          description: The start range for the fee.
          example: '1000'
        endRange:
          type: string
          description: The end range for the fee.
          example: '5000'
        precedence:
          type: string
          description: The precedence of the fee.
          example: '1'
        taxes:
          $ref: '#/components/schemas/Taxes'
        tierFees:
          type: array
          items:
            $ref: '#/components/schemas/TierFee'
        payload:
          type: object
          additionalProperties: true
    WaiverCriteria:
      type: object
      properties:
        type:
          type: string
          description: The type of criteria for the waiver.
          example: TRANSACTION
          enum:
          - TRANSACTION
          - TIME_BASED
          - TRANSACTION_BASED
        value:
          type: array
          items:
            type: string
        minMaxOperand:
          type: string
          description: The operand for the minimum and maximum values.
          example: GREATER
        minTransactionAmount:
          type: string
          description: The minimum transaction amount for the waiver.
          example: '1000'
        maxTransactionAmount:
          type: string
          description: The maximum transaction amount for the waiver.
          example: '5000'
        transactionPeriod:
          type: string
          description: The period for the transaction.
          example: MONTHLY
        transactionPeriodOperand:
          type: string
          description: The operand for the transaction period.
          example: GREATER
        transactionPeriodWaiverMaxLimit:
          type: string
          description: The maximum limit for the transaction period waiver.
          example: '10'
        transactionAmountOperand:
          type: string
          description: The operand for the transaction amount.
          example: GREATER
        transactionAmountValue:
          type: string
          description: The value for the transaction amount.
          example: '1000'
        excludeCashAdvance:
          type: boolean
          description: Whether to exclude cash advance transactions.
          example: true
          enum:
          - true
          - false
        startDate:
          type: string
          description: The start date for the waiver.
          example: '2023-01-01'
        endDate:
          type: string
          description: The end date for the waiver.
          example: '2023-12-31'
    Taxes:
      type: object
      properties:
        cgst:
          $ref: '#/components/schemas/Tax'
        igst:
          $ref: '#/components/schemas/Tax'
        sgst:
          $ref: '#/components/schemas/Tax'
    TransactionCategory:
      type: object
      properties:
        programCategory:
          type: string
          description: The program category.
          example: RETAIL
        refinancingRateAfterDueDate:
          type: number
          description: The refinancing rate after the due date.
          example: 0.05
        defaultRate:
          type: number
          description: The default rate for the transaction category.
          example: 0.1
        fineRate:
          type: number
          description: The fine rate for the transaction category.
          example: 0.02
        overdueRateAfterDueDate:
          type: number
          description: The overdue rate after the due date.
          example: 0.03
        minimumValue:
          type: number
          description: The minimum value for the transaction category.
          example: 1000
        chargeOrder:
          type: number
          description: The order in which the charge is applied.
          example: 1
        npaChargeOrder:
          type: number
          description: The order in which the NPA charge is applied.
          example: 2
    Waiver:
      type: object
      properties:
        triggerType:
          type: string
          description: The type of trigger for the waiver.
          enum:
          - TRANSACTION
          - TIME_BASED
          - TRANSACTION_BASED
          example: TRANSACTION
        triggerValues:
          type: array
          items:
            type: string
        status:
          type: string
          description: The status of the waiver.
          example: ACTIVE
          enum:
          - ACTIVE
          - INACTIVE
        criteria:
          $ref: '#/components/schemas/WaiverCriteria'
    TierFee:
      type: object
      properties:
        minAmount:
          type: string
          description: The minimum amount for the tier fee.
          example: '1000'
        maxAmount:
          type: string
          description: The maximum amount for the tier fee.
          example: '5000'
        tierFeeModelType:
          type: string
          description: The type of tier fee model.
          example: PERCENTAGE
          enum:
          - PERCENTAGE
          - FIXED
