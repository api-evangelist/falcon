openapi: 3.2.0
info:
  title: Repayment Initiate Payment API
  description: API endpoints for credit card repayments, including bill payments, reversals, auto-debit configurations, and payment status checks.
  version: 1.0.0
servers:
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1
tags:
- name: Initiate Payment
paths:
  /initiate-payment:
    post:
      security:
      - bearerAuth: []
      summary: Repayment via a Payment Gateway
      description: Use this endpoint to make repayment using a payment gateway.
      operationId: initiate-payment-pg
      parameters:
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accountId
              - amountType
              - amount
              - redirectUrl
              properties:
                accountId:
                  type: string
                  description: The account ID for the repayment.
                  example: b3488889-5a07-48d5-99b4-fa963fdfbb02
                amountType:
                  type: string
                  description: The type of amount for the repayment.
                  example: OTHER
                amount:
                  type: string
                  description: The repayment amount.
                  example: '10000'
                redirectUrl:
                  type: string
                  description: The URL to redirect to after the payment.
                  example: https://creditkvbqa.tab.kitecash.in/home
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                example: {}
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      tags:
      - Initiate Payment
