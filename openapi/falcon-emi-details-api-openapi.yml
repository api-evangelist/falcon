openapi: 3.2.0
info:
  title: Emi Details API
  description: APIs for managing EMI plans and transactions
  version: 1.0.0
servers:
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1
tags:
- name: Emi Details
paths:
  /emi-details:
    get:
      security:
      - bearerAuth: []
      summary: View EMI Details
      description: Use this endpoint to view details of an EMI.
      operationId: view-emi-details
      parameters:
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - loanID
              properties:
                loanID:
                  type: string
                  description: ID of the loan to view details for.
                  example: '123456'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  Contract:
                    type: object
                    description: Contract details of the EMI.
                    properties:
                      TransactionDetails:
                        type: array
                        description: Details of the transaction.
                        items:
                          type: object
                          properties:
                            TransactionID:
                              type: integer
                              description: ID of the transaction.
                              example: 36121312
                            TransactionDateTime:
                              type: string
                              description: Date and time of the transaction in DD/MM/YYYY HH:MM:SS format.
                              example: 23/03/2024 16:10:34
                            MerchantName:
                              type: string
                              description: Name of the merchant for the transaction.
                              example: Amazon
                            TransactionAmount:
                              type: number
                              description: Amount of the transaction.
                              example: 1000
                      LoanDetails:
                        type: object
                        description: Details of the loan.
                        properties:
                          InterestRate:
                            type: number
                            description: Interest rate for the loan.
                            example: 32
                          EMIAmount:
                            type: number
                            description: Amount of the EMI.
                            example: 216.28
                          TotalPrincipalAmount:
                            type: number
                            description: Total principal amount for the loan.
                            example: 1000
                          Status:
                            type: string
                            description: Status of the loan.
                            example: Active
                      TotalPayable:
                        type: number
                        description: Total amount payable for the loan.
                        example: 1096.06
                      LoanSchedules:
                        type: array
                        description: Details of the loan schedules.
                        items:
                          type: object
                          properties:
                            InstallmentNumber:
                              type: integer
                              description: Number of the installment.
                              example: 1
                            InstallmentID:
                              type: integer
                              description: ID of the installment.
                              example: 5165276
                            PrincipalAmount:
                              type: number
                              description: Amount of the principal for the installment.
                              example: 189.61
                            InterestAmount:
                              type: number
                              description: Amount of the interest for the installment.
                              example: 26.67
                            BillingDate:
                              type: string
                              description: Billing date for the installment in DD/MM/YYYY format.
                              example: 25/03/2024
                            Status:
                              type: string
                              description: Status of the installment.
                              example: Pending
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      tags:
      - Emi Details
