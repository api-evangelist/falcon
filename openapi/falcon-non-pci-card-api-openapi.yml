openapi: 3.2.0
info:
  title: Credit Card Non Pci Card API
  description: APIs for managing credit cards, including issuance, activation, limits, and transactions.
  version: 1.0.0
servers:
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1/
tags:
- name: Non Pci Card
paths:
  /non-pci-card/{cardId}:
    post:
      summary: View Card Details (Non-PCI)
      description: Use this endpoint to get non-sensitive card details.
      operationId: view-non-pci-card-details
      parameters:
      - name: cardId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the non-PCI card.
        example: 9824c2dc-65ac-417a-a11c-43e47e8dfa6t
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
        example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer {{access_token}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  maskedCardNumber:
                    type: string
                    description: The masked card number.
                    example: 807470XXXXXX3967
                  encryptedExpiry:
                    type: string
                    description: The encrypted expiry of the card.
                    example: bOI4YJU+QV3d8BBqXg4pFQ==
                  cardHolderName:
                    type: string
                    description: The name of the cardholder.
                    example: SOMNATH TRIPATHI
                  cardStatus:
                    type: string
                    description: The status of the card.
                    example: ACTIVE
                    enum:
                    - ACTIVE
                    - BLOCKED
                    - INACTIVE
                    - EXPIRED
                  usageStatus:
                    type: string
                    description: The usage status of the card.
                    example: ACTIVE
                    enum:
                    - ACTIVE
                    - BLOCKED
                    - INACTIVE
                    - EXPIRED
                  deliveryStatus:
                    type: string
                    description: The delivery status of the card.
                    example: DELIVERED
                    enum:
                    - DELIVERED
                    - PENDING
                    - RETURNED
                  isPrimary:
                    type: boolean
                    description: Indicates if the card is a primary card.
                    example: true
                    enum:
                    - true
                    - false
                  balance:
                    type: string
                    description: The balance available on the card.
                    example: 1000
                  cardType:
                    type: string
                    description: The type of card.
                    example: PERSONALIZED
                    enum:
                    - PERSONALIZED
                    - NON_PERSONALIZED
                  formFactor:
                    type: string
                    description: The form factor of the card.
                    example: PHYSICAL
                    enum:
                    - VIRTUAL
                    - PHYSICAL
                  cardMaterial:
                    type: string
                    description: The material of the card.
                    example: METAL
                    enum:
                    - PLASTIC
                    - METAL
                  blockedReason:
                    type: string
                    description: The reason for blocking the card.
                    example: LOST
                    enum:
                    - LOST
                    - STOLEN
                    - FRAUD
                    - OTHER
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized access
        '404':
          description: Account not found
      tags:
      - Non Pci Card
