paths:
  /product:
    post:
      summary: Assign a Program to an Enterprise
      description: Use this endpoint to assign a program to an enterprise.
      operationId: associate-enterprise-with-program
      parameters:
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - enterpriseID
              - programeID
              properties:
                enterpriseID:
                  type: string
                  description: The unique ID of the enterprise to be associated with the program.
                  example: Wework
                programeID:
                  type: string
                  description: The unique ID of the program to be associated with the enterprise.
                  example: SFCC01
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                example: {}
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
