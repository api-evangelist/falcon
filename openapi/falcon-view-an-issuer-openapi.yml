openapi: 3.0.0
info:
  title: View an Issuer
  description: Use this endpoint to fetch details of an issuer.
  version: 1.0.0
servers:
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1
paths:
  /issuer/{issuerType}:
    get:
      summary: View an Issuer
      description: Use this endpoint to view an issuer.
      security:
      - bearerAuth: []
      operationId: view-issuer
      parameters:
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: issuerType
        in: path
        required: true
        schema:
          type: string
          example: Small Finance Bank
          description: The issuer type you want to see the details.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuerName:
                    type: string
                    description: The issuer name you want to add.
                    example: Shivalik
                  issuerType:
                    type: string
                    description: The issuer type you want to add.
                    example: Small Finance Bank
                  productCategories:
                    type: string
                    description: The card category.
                    example: Credit
                  registeredName:
                    type: string
                    description: The issuer registered name.
                    example: Shivalik Small Finance Bank
                  brandName:
                    type: string
                    description: The issuer brand name.
                    example: Shivalik Small Finance Bank
                  brandLogo:
                    type: string
                    description: The issuer logo.
                    example: ssfb.png
                  address:
                    type: string
                    description: The complete address of the issuer.
                    example: 6th Floor Infotech Tower Greater Noida
                  country:
                    type: string
                    description: The issuer country.
                    example: India
                  website:
                    type: string
                    format: uri
                    description: The issuer website.
                    example: https://shivalikbank.com/
                  title:
                    type: string
                    description: The title of the administrator/POC.
                    example: Mr.
                  personalDetails:
                    type: object
                    description: The personal details of the point of contact of the issuer.
                    properties:
                      contactName:
                        type: string
                        description: The name of the administrator/POC of the issuer.
                        example: Keshav
                      contactEmail:
                        type: string
                        format: email
                        description: The contact email of the administrator/POC of the issuer.
                        example: keshav@shivalikb.com
                      contactNumber:
                        type: string
                        description: The contact number of the administrator/POC of the issuer.
                        example: 9871323241
                      supportEmail:
                        type: string
                        format: email
                        description: The support email ID of the issuer.
                        example: support@shivalikb.com
                      supportNumber:
                        type: string
                        description: The support contact number of the issuer.
                        example: 1206756543
                  agreement:
                    type: string
                    description: The duly signed agreement file.
                    example: ShivalikSOP.pdf
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
x-provenance:
  method: searched
  source: https://docs.falconfs.com/reference
  harvested: '2026-10-14'
  tool: harvest-readme-openapi.py
  note: Assembled verbatim from the OpenAPI definition ReadMe embeds in each operation page of the provider's developer portal; paths and components merged by API title, nothing authored.
  assembled_from:
  - https://docs.falconfs.com/reference/view-issuer.md
