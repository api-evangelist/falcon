openapi: 3.2.0
info:
  title: EMI Transaction Eligibility API
  description: APIs for managing EMI plans and transactions
  version: 1.0.0
servers:
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1
tags:
- name: Transaction Eligibility
paths:
  /transaction-eligibility:
    get:
      security:
      - bearerAuth: []
      summary: View Transaction Eligibility
      description: Use this endpoint to determine whether a transaction is available for the EMI conversion.
      operationId: transaction-eligibility
      parameters:
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - transactionID
              properties:
                transactionID:
                  type: array
                  items:
                    type: integer
                    description: List of transaction IDs to check eligibility for EMI conversion.
                    example:
                    - 123456
                    - 96305698
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    TransactionID:
                      type: string
                      description: ID of the transaction.
                      example: '123456'
                    AplicableEmiPlanID:
                      type: string
                      description: ID of the applicable EMI plan.
                      example: abs123
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      tags:
      - Transaction Eligibility
