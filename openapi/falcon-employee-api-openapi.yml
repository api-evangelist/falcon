openapi: 3.2.0
info:
  title: View List of Users of an Enterprise Employee API
  description: Use this endpoint to get list of all the users registered to a particular enterprise.
  version: 1.0.0
servers:
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1/
tags:
- name: Employee
paths:
  /employee/{enterpriseID}:
    get:
      summary: View List of Users of an Enterprise
      description: Use this endpoint to get list of all the users registered to a particular enterprise.
      parameters:
      - name: enterpriseID
        in: path
        required: true
        schema:
          type: string
          description: The ID of the enterprise to fetch users from.
          example: Wework
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Employee
      operationId: getEmployeeByEnterpriseID
      x-operation-id-source: derived
components:
  schemas:
    EmployeeResponse:
      type: object
      properties:
        enterpriseID:
          type: string
          description: The ID of the enterprise.
          example: Wework
        enterpriseName:
          type: string
          description: The name of the enterprise.
          example: Wework
        userDetails:
          type: array
          items:
            type: object
            properties:
              userID:
                type: string
                description: The ID of the user.
                example: '12345'
              userFirstName:
                type: string
                description: The first name of the user.
                example: John
              userLastName:
                type: string
                description: The last name of the user.
                example: Doe
        total_count:
          type: integer
          description: The total number of users in the enterprise.
          example: 4
