paths:
  /update-status-emi-plan:
    put:
      security:
      - bearerAuth: []
      summary: Update EMI Plan Status
      description: Use this endpoint to update the status of the EMI plan.
      parameters:
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - EmiPlanID
              - Status
              properties:
                EmiPlanID:
                  type: string
                  description: ID of the EMI plan to update.
                  example: emiPlanID123
                Status:
                  type: string
                  description: New status for the EMI plan.
                  example: inactive
                  enum:
                  - active
                  - inactive
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: string
                    description: Status of the response.
                    example: success
                    enum:
                    - success
                    - failure
                  EmiPlanID:
                    type: string
                    description: ID of the EMI plan.
                    example: emiPlanID123
                  Code:
                    type: string
                    description: Response code.
                    example: '200'
                  CodeDescription:
                    type: string
                    description: Description of the response code.
                    example: EMI plan status updated successfully
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      tags:
      - Update Status Emi Plan
      operationId: putUpdateStatusEmiPlan
      x-operation-id-source: derived
