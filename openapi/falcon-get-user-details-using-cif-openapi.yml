openapi: 3.0.0
info:
  title: Get User Details using CIF
  description: Use this endpoint to fetch details of a particular user using CIF number.
  version: 1.0.0
servers:
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1
paths:
  /user/cif-number/{cifNumber}:
    get:
      summary: Get User Details using CIF
      description: Use this endpoint to fetch details of a particular user using CIF number.
      operationId: get-user-by-cif
      parameters:
      - name: cifNumber
        in: path
        required: true
        schema:
          type: string
        description: The CIF number of the user.
        example: '27123678314'
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
        example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer {{access_token}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  enterpriseID:
                    type: string
                    description: The enterprise ID of the user.
                    example: Wework
                  aggregatorName:
                    type: string
                    description: The name of the aggregator.
                    example: VoloPay
                  programeID:
                    type: string
                    description: The program ID under which the user is registered.
                    example: SFCC01
                  creditLimit:
                    type: string
                    description: The credit limit of the user.
                    example: '10000'
                  cashAdvanceLimit:
                    type: string
                    description: The cash advance limit of the user.
                    example: '500'
                  personalDetails:
                    type: array
                    items:
                      type: object
                      properties:
                        userFullName:
                          type: string
                          description: The full name of the user.
                          example: Abhinav
                        userMiddleName:
                          type: string
                          description: The middle name of the user.
                          example: M S
                        userLastName:
                          type: string
                          description: The last name of the user.
                          example: Sharma
                        userPAN:
                          type: string
                          description: The PAN of the user.
                          example: ABPS1234C
                        userMobileNumber:
                          type: string
                          description: The mobile number of the user.
                          example: '9876543210'
                        userDOB:
                          type: string
                          description: The date of birth of the user.
                          example: 22-01-1990
                        userGender:
                          type: string
                          description: The gender of the user.
                          example: Male
                          enum:
                          - Male
                          - Female
                          - Other
                        fatherName:
                          type: string
                          description: The name of the user's father.
                          example: B. P. Sharma
                        motherName:
                          type: string
                          description: The name of the user's mother.
                          example: Shikha Sharma
                        userOVDType:
                          type: string
                          description: The type of OVD (Officially Valid Document) of the user.
                          enum:
                          - Driving License
                          - Passport
                          - Voter ID
                          - Aadhar
                          example: Driving License
                        userOVDID:
                          type: string
                          description: The ID of the OVD of the user.
                          example: DL-1234567890123
                        userKYCAddress:
                          type: string
                          description: The KYC address of the user.
                          example: 1206/C2 Gurgaon
                        deliveryAddress:
                          type: string
                          description: The delivery address of the user.
                          example: 1208/C2 Gurgaon
