openapi: 3.0.1
info:
  title: Add a User
  description: Use this endpoint to add a new user.
  version: 1.0.0
servers:
- url: https://stage1.tab.kitecash.in/open-api/falcon/v1
paths:
  /user:
    post:
      summary: Add a User
      description: Use this endpoint to add a new user.
      operationId: add-user
      parameters:
      - in: header
        name: x-tenant-id
        schema:
          type: string
        required: true
        example: falcon
      - in: header
        name: Authorization
        schema:
          type: string
        required: true
        example: Bearer {access_token}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - aggregatorName
              - programId
              - userFirstName
              - userMiddleName
              - userLastName
              - userPAN
              - countryCode
              - userMobileNumber
              - kycAddress
              - kycAddress[].address1
              - kycAddress[].address2
              - kycAddress[].city
              - kycAddress[].state
              - kycAddress[].pinCode
              - userOfficeAddress
              - userOfficeAddress[].address1
              - userOfficeAddress[].address2
              - userOfficeAddress[].city
              - userOfficeAddress[].state
              - userOfficeAddress[].pinCode
              - deliveryAddress
              - deliveryAddress[].address1
              - deliveryAddress[].address2
              - deliveryAddress[].city
              - deliveryAddress[].state
              - deliveryAddress[].pinCode
              properties:
                address:
                  type: object
                  properties:
                    kycAddress:
                      $ref: '#/components/schemas/Address'
                    userOfficeAddress:
                      $ref: '#/components/schemas/Address'
                    deliveryAddress:
                      $ref: '#/components/schemas/Address'
                enterpriseId:
                  type: string
                  description: The unique enterprise ID of the user.
                  example: '1234567890'
                aggregatorName:
                  type: string
                  description: The name of the aggregator.
                  example: Volopay
                programId:
                  type: string
                  description: The unique program ID of the user.
                  example: SFCC01
                userFirstName:
                  type: string
                  description: The first name of the user.
                  example: John
                userMiddleName:
                  type: string
                  description: The middle name of the user.
                  example: Doe
                userLastName:
                  type: string
                  description: The last name of the user.
                  example: Smith
                userPAN:
                  type: string
                  description: The PAN number of the user.
                  example: ABCDE1234F
                countryCode:
                  type: integer
                  description: The country code of the user.
                  example: 91
                userMobileNumber:
                  type: string
                  description: The mobile number of the user.
                  example: '9876543210'
                userDOB:
                  type: string
                  description: The date of birth of the user.
                  example: '1990-01-01'
                userGender:
                  type: string
                  description: The user gender.
                  example: Male
                  enum:
                  - Male
                  - Female
                  - Other
                fatherName:
                  type: string
                  description: The name of the user's father.
                  example: Robert
                motherName:
                  type: string
                  description: The name of the user's mother.
                  example: Mary
                userOVDType:
                  type: string
                  description: The type of OVD (Officially Valid Document).
                  example: Passport
                  enum:
                  - Passport
                  - Aadhar
                  - VoterID
                  - DrivingLicense
                userOVDID:
                  type: string
                  description: The ID of the OVD.
                  example: A123456789
                salutation:
                  type: string
                  description: The salutation of the user.
                  example: Mr.
                  enum:
                  - Mr
                  - Mrs
                  - Ms
                profession:
                  type: string
                  description: The profession of the user.
                  example: Software Engineer
                spouseName:
                  type: string
                  description: The name of the user's spouse.
                  example: Jane
                totalLengthOfService:
                  type: integer
                  description: The total length of service of the user.
                  example: 5
                lengthOfService:
                  type: string
                  description: The length of service of the user.
                  example: 2 years
                income:
                  type: integer
                  description: The income of the user.
                  example: 500000
                dependents:
                  type: integer
                  description: The number of dependents of the user.
                  example: 2
                netWorth:
                  type: integer
                  description: The net worth of the user.
                  example: 1000000
                immovableAssetWorth:
                  type: integer
                  description: The worth of immovable assets of the user.
                  example: 500000
                movableAssetWorth:
                  type: integer
                  description: The worth of movable assets of the user.
                  example: 300000
                payslip:
                  type: string
                  description: The payslip of the user.
                  example: payslip.pdf
                incomeTaxReturn:
                  type: string
                  description: The income tax return of the user.
                  example: ITR.pdf
                nationality:
                  type: string
                  description: The nationality of the user.
                  example: Indian
                kycStatus:
                  type: string
                  description: The KYC status of the user.
                  example: Verified
                  enum:
                  - Verified
                  - Pending
                  - Rejected
                profilePicture:
                  type: string
                  description: The profile picture of the user.
                  example: profile.jpg
                status:
                  type: string
                  description: The status of the user.
                  example: Active
                  enum:
                  - Active
                  - Inactive
                applicationId:
                  type: string
                  description: The application ID of the user.
                  example: APP123456
                userConsent:
                  type: boolean
                  description: The consent of the user.
                  example: true
                  enum:
                  - true
                  - false
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    description: The unique ID of the created user.
                    example: USR123456
                  vkycLink:
                    type: string
                    description: The link to the vKYC process.
                    example: https://vkyc.example.com/user/USR123456
components:
  schemas:
    Address:
      type: object
      properties:
        address1:
          type: string
          description: The first line of the address.
          example: 123 Main St
        address2:
          type: string
          description: The second line of the address.
          example: Apt 4B
        address3:
          type: string
          description: The third line of the address.
          example: Building 5
        city:
          type: string
          description: The city of the address.
          example: New York
        state:
          type: string
          description: The state of the address.
          example: NY
        pinCode:
          type: string
          description: The postal code of the address.
          example: '10001'
