    TransactionLimits:
      type: object
      properties:
        perTransactionLimit:
          type: integer
          description: Per transaction limit of the card.
          example: 1000
        dailyTransactionAmount:
          type: integer
          description: Daily transaction amount limit of the card.
          example: 2000
        dailyTransactionCount:
          type: integer
          description: Daily transaction count limit of the card.
          example: 10
        monthlyTransactionAmount:
          type: integer
          description: Monthly transaction amount limit of the card.
          example: 60000
        monthlyTransactionCount:
          type: integer
          description: Monthly transaction count limit of the card.
          example: 300
    SpendLimits:
      type: object
