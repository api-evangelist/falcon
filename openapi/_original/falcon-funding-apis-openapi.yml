# x-archived-from: falcon-funding-apis-openapi.yml
# x-archived-on: 2026-10-16
openapi: 3.0.1
info:
  title: Funding APIs
  description: APIs to fund user accounts and reverse funding transactions.
  version: 1.0.0
servers:
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1
paths:
  /account:
    post:
      security:
      - bearerAuth: []
      summary: Fund a User Account
      description: Use this endpoint to add money to user account.
      operationId: fund-user-account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - currency
              - enterpriseAccount
              - userAccount
              - amount
              - remarks
              properties:
                currency:
                  type: string
                  description: The currency in which the amount is specified.
                  example: INR
                enterpriseAccount:
                  type: integer
                  description: The enterprise account number from which the funds will be debited.
                  example: 202000004780
                userAccount:
                  type: integer
                  description: The user account number to which the funds will be credited.
                  example: 202000004782
                amount:
                  type: integer
                  description: The amount to be funded to the user account.
                  example: 10000
                remarks:
                  type: string
                  description: Remarks or notes regarding the funding transaction.
                  example: Funding
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  enterpriseAccount:
                    type: integer
                    description: The enterprise account number from which the funds were debited.
                    example: 202000004780
                  userAccount:
                    type: integer
                    description: The user account number to which the funds were credited.
                    example: 202000004782
                  currency:
                    type: string
                    description: The currency in which the amount is specified.
                    example: INR
                  amount:
                    type: integer
                    description: The amount that was funded to the user account.
                    example: 10000
                  transactionStatus:
                    type: string
                    description: The status of the transaction.
                    example: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /account/funds:
    post:
      security:
      - bearerAuth: []
      summary: Reverse a Funding
      description: Use this endpoint to reverse funds from a user account to an enterprise account.
      operationId: reverse-funding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - currency
              - enterpriseAccount
              - userAccount
              - amount
              - remarks
              properties:
                enterpriseAccount:
                  type: integer
                  description: The enterprise account number from which the funds will be debited.
                  example: 202000004780
                userAccount:
                  type: integer
                  description: The user account number to which the funds will be credited.
                  example: 202000004782
                currency:
                  type: string
                  description: The currency in which the amount is specified.
                  example: INR
                amount:
                  type: integer
                  description: The amount to be reversed from the user account.
                  example: 10000
                remarks:
                  type: string
                  description: Remarks or notes regarding the reverse transaction.
                  example: Reversing funds
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  enterpriseAccount:
                    type: integer
                    description: The enterprise account number from which the funds were debited.
                    example: 202000004780
                  userAccount:
                    type: integer
                    description: The user account number to which the funds were credited.
                    example: 202000004782
                  currency:
                    type: string
                    description: The currency in which the amount is specified.
                    example: INR
                  amount:
                    type: integer
                    description: The amount that was reversed from the user account.
                    example: 10000
                  transactionStatus:
                    type: string
                    description: The status of the transaction.
                    example: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
