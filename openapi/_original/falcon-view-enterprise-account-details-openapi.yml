openapi: 3.0.0
info:
  title: View Enterprise Account Details
  description: Use this endpoint to fetch details of a particular enterprise account.
  version: 1.0.0
servers:
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1
paths:
  /account/{programID}/{enterpriseID}:
    get:
      summary: View Enterprise Account Details
      description: Use this endpoint to fetch details of a particular enterprise account.
      operationId: view-enterprise-account-details
      parameters:
      - name: enterpriseID
        in: path
        required: true
        schema:
          type: string
          description: The unique identifier of the enterprise.
          example: Wework
      - name: programID
        in: path
        required: true
        schema:
          type: string
          description: The program ID under which the account is managed.
          example: SFC01
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                    description: The unique identifier of the account.
                    example: '202000004784'
                  accountStatus:
                    type: string
                    description: The current status of the account.
                    example: ACTIVE
                    enum:
                    - ACTIVE
                    - INACTIVE
                  programeID:
                    type: string
                    description: The associated program ID.
                    example: SFCC01
                  openingDate:
                    type: string
                    format: date
                    description: Date when the account was opened.
                    example: 22/11/2021
                  billingCycleFrequency:
                    type: string
                    description: The frequency of billing cycle.
                    example: Monthly
                  formFactor:
                    type: string
                    description: The type of the card issued.
                    example: Virtual
                  primaryCardNumberMasked:
                    type: string
                    description: Masked primary card number.
                    example: 807470XXXXXX3967
                  status:
                    type: string
                    description: The status of the account.
                    example: ACTIVE
                    enum:
                    - ACTIVE
                    - INACTIVE
                  currency:
                    type: string
                    description: The currency of the account.
                    example: INR
                  cardId:
                    type: string
                    description: The unique identifier for the card.
                    example: 431a7211-b269-4c9a-9fb6-d9d3a087acf6
                  creditLimit:
                    type: number
                    description: The credit limit assigned to the account.
                    example: 10000
                  cashAdvanceLimit:
                    type: number
                    description: Cash advance limit assigned to the account.
                    example: 1000
                  availableCashAdvanceLimit:
                    type: number
                    description: Available cash advance limit.
                    example: 1000
                  availableCreditLimit:
                    type: number
                    description: Available credit limit.
                    example: 3000
                  outstandingAmount:
                    type: number
                    description: Outstanding amount on the account.
                    example: 4000
                  unbilledCreditAmount:
                    type: number
                    description: Unbilled credit amount.
                    example: 1000
                  outstandingAuthorisationAmount:
                    type: number
                    description: Outstanding authorization amount.
                    example: 2000
                  minimumAmountDue:
                    type: number
                    description: Minimum amount due.
                    example: 300
                  totalAmountDue:
                    type: string
                    description: Total amount due on the account.
                    example: '7000'
                  dueDate:
                    type: string
                    format: date
                    description: Due date for the payment.
                    example: '2023-08-05'
                  currentstatementStartDate:
                    type: string
                    format: date
                    description: Start date of the current statement period.
                    example: '2023-11-05'
                  currentstatementEndDate:
                    type: string
                    format: date
                    description: End date of the current statement period.
                    example: '2023-12-05'
