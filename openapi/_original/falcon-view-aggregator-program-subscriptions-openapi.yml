# x-archived-from: falcon-view-aggregator-program-subscriptions-openapi.yml
# x-archived-on: 2026-10-16
openapi: 3.0.3
info:
  title: View Aggregator Program Subscriptions
  description: Use this endpoint to fetch a list of all the programs subscribed by an aggregator.
  version: 1.0.0
servers:
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1
paths:
  /product/{aggregatorID}:
    get:
      summary: View Aggregator Program Subscriptions
      description: Use this endpoint to fetch a list of all the programs subscribed by an aggregator.
      operationId: view-aggregator-program
      parameters:
      - name: aggregatorID
        in: path
        required: true
        schema:
          type: string
          description: The unique identifier of the aggregator.
          example: Volopay
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  aggregatorDetails:
                    type: array
                    items:
                      type: object
                      properties:
                        product:
                          type: string
                          description: The name of the product.
                          example: Commercial Credit Card
                        productVariant:
                          type: string
                          description: The variant of the product.
                          example: Shivalik Falcon Credit Card
                        program:
                          type: string
                          description: The name of the program.
                          example: Classic Credit Card
                        programeID:
                          type: string
                          description: The unique identifier of the program.
                          example: SFCC01
              example:
                aggregatorDetails:
                - product: Commercial Credit Card
                  productVariant: Shivalik Falcon Credit Card
                  program: Classic Credit Card
                  programeID: SFCC01
                - product: Commercial Credit Card
                  productVariant: Shivalik Falcon Credit Card
                  program: Platinum Credit Card
                  programeID: SFCC02
                - product: Commercial Credit Card
                  productVariant: ICICI Falcon Credit Card
                  program: Classic Credit Card
                  programeID: ICICIFCC01
                - product: Commercial Credit Card
                  productVariant: Shivalik MMT Credit Card
                  program: Travel Card
                  programeID: MMTSCC01
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Aggregator not found
        '500':
          description: Internal server error
