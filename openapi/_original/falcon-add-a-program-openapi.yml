          example: '123456'
        binRangeStart:
          type: string
          description: The start of the bin range.
          example: '123456'
        binRangeEnd:
          type: string
          description: The end of the bin range.
          example: '123459'
        countryCode:
          type: string
          description: The country code.
          example: IN
        currencyCode:
          type: string
          description: The currency code.
          example: INR
        timeZone:
          type: string
          description: The time zone.
          example: Asia/Kolkata
        dueDate:
          type: string
          description: The due date of the program.
          example: '2023-01-01'
        duration:
