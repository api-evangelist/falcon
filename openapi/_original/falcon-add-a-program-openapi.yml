    post:
      security:
      - bearerAuth: []
      summary: Add a Program
      description: Use this endpoint to add a new program.
      operationId: add-program
      parameters:
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
          example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {{access_token}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - issuerName
              - productCategories
              - product
              - productVariant
              - program
              - startDate
              - endDate
              - binValue
              - binRangeStart
