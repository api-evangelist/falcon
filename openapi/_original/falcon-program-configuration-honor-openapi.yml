info:
  title: Program Configuration Honor
  description: Use this endpoint to program config honor.
  version: 1.0.0
servers:
- url: https://stage1.tab.kitecash.in/cc-open-api/falcon/v1/
paths:
  /program/{programId}/config:
    post:
      summary: Program Configuration Honor
      description: Use this endpoint to program config honor.
      operationId: program-config-honor
      parameters:
      - name: programId
        in: path
        required: true
        schema:
          type: string
          description: The unique identifier for the credit card program.
          example: '12345'
      - name: x-tenant-id
        in: header
        required: true
        schema:
          type: string
        example: falcon
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          format: bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cashAdvanceFee:
                  $ref: '#/components/schemas/FeeWaiver'
                annualFee:
                  $ref: '#/components/schemas/FeeWaiver'
                cardReplacementFee:
                  $ref: '#/components/schemas/FeeWaiver'
                fuelSurcharge:
                  $ref: '#/components/schemas/FeeWaiver'
                internationalPurchase:
                  $ref: '#/components/schemas/FeeWaiver'
                internationalWithdrawal:
                  $ref: '#/components/schemas/FeeWaiver'
                internationalWithdrawalMarkup:
                  $ref: '#/components/schemas/FeeWaiver'
                emiProcessingFee:
                  $ref: '#/components/schemas/FeeWaiver'
                emiForeClosureFee:
                  $ref: '#/components/schemas/FeeWaiver'
                rentalFee:
                  $ref: '#/components/schemas/FeeWaiver'
                latePaymentFee:
                  $ref: '#/components/schemas/FeeWaiver'
                rewardRedemption:
                  $ref: '#/components/schemas/FeeWaiver'
                overLimitFee:
                  $ref: '#/components/schemas/FeeWaiver'
                transactionCategories:
                  type: array
                  items:
                    $ref: '#/components/schemas/TransactionCategory'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                example: {}
                additionalProperties: false
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
components:
  schemas:
    FeeWaiver:
      type: object
      properties:
        fee:
          $ref: '#/components/schemas/Fee'
        waiver:
          $ref: '#/components/schemas/Waiver'
    Fee:
      type: object
      properties:
        feeModelType:
          type: string
          description: The type of fee model.
          enum:
          - FIXED
          - PERCENTAGE
          - GREATER
          - TIERED
        fixedAmount:
          type: string
          description: The fixed amount for the fee.
          example: '100'
        percentValue:
          type: string
          description: The percentage value for the fee.
          example: '5'
        startRange:
          type: string
          description: The start range for the fee.
          example: '1000'
        endRange:
          type: string
          description: The end range for the fee.
          example: '5000'
        precedence:
          type: string
          description: The precedence of the fee.
          example: '1'
        taxes:
          $ref: '#/components/schemas/Taxes'
        tierFees:
          type: array
          items:
            $ref: '#/components/schemas/TierFee'
        payload:
          type: object
          additionalProperties: true
    Waiver:
      type: object
      properties:
        triggerType:
          type: string
          description: The type of trigger for the waiver.
          enum:
          - TRANSACTION
          - TIME_BASED
          - TRANSACTION_BASED
          example: TRANSACTION
        triggerValues:
          type: array
          items:
            type: string
        status:
          type: string
          description: The status of the waiver.
          example: ACTIVE
          enum:
          - ACTIVE
          - INACTIVE
        criteria:
          $ref: '#/components/schemas/WaiverCriteria'
    WaiverCriteria:
      type: object
      properties:
        type:
          type: string
          description: The type of criteria for the waiver.
          example: TRANSACTION
          enum:
          - TRANSACTION
          - TIME_BASED
          - TRANSACTION_BASED
        value:
          type: array
          items:
            type: string
        minMaxOperand:
          type: string
          description: The operand for the minimum and maximum values.
          example: GREATER
        minTransactionAmount:
          type: string
          description: The minimum transaction amount for the waiver.
          example: '1000'
        maxTransactionAmount:
          type: string
          description: The maximum transaction amount for the waiver.
          example: '5000'
        transactionPeriod:
          type: string
          description: The period for the transaction.
          example: MONTHLY
        transactionPeriodOperand:
          type: string
          description: The operand for the transaction period.
          example: GREATER
        transactionPeriodWaiverMaxLimit:
          type: string
          description: The maximum limit for the transaction period waiver.
          example: '10'
        transactionAmountOperand:
          type: string
          description: The operand for the transaction amount.
          example: GREATER
        transactionAmountValue:
          type: string
          description: The value for the transaction amount.
          example: '1000'
        excludeCashAdvance:
          type: boolean
          description: Whether to exclude cash advance transactions.
          example: true
          enum:
          - true
          - false
        startDate:
          type: string
          description: The start date for the waiver.
          example: '2023-01-01'
        endDate:
          type: string
          description: The end date for the waiver.
          example: '2023-12-31'
    Taxes:
      type: object
      properties:
        cgst:
          $ref: '#/components/schemas/Tax'
        igst:
          $ref: '#/components/schemas/Tax'
        sgst:
          $ref: '#/components/schemas/Tax'
    Tax:
      type: object
      properties:
        taxModelType:
          type: string
          description: The type of tax model.
          example: PERCENTAGE
          enum:
          - PERCENTAGE
          - FIXED
        percentValue:
          type: string
          description: The percentage value for the tax.
          example: '5'
    TierFee:
      type: object
      properties:
        minAmount:
          type: string
          description: The minimum amount for the tier fee.
          example: '1000'
        maxAmount:
          type: string
          description: The maximum amount for the tier fee.
          example: '5000'
        tierFeeModelType:
          type: string
          description: The type of tier fee model.
          example: PERCENTAGE
          enum:
          - PERCENTAGE
          - FIXED
        fixedAmount:
          type: string
          description: The fixed amount for the tier fee.
          example: '100'
        chargeableReasons:
          type: array
          description: The reasons for the chargeable fee.
          enum:
          - REWARD_REDEMPTION
          - CASH_ADVANCE
          example: REWARD_REDEMPTION
          items:
            type: string
    TransactionCategory:
      type: object
      properties:
        programCategory:
          type: string
          description: The program category.
          example: RETAIL
        refinancingRateAfterDueDate:
          type: number
          description: The refinancing rate after the due date.
          example: 0.05
        defaultRate:
          type: number
          description: The default rate for the transaction category.
          example: 0.1
        fineRate:
          type: number
          description: The fine rate for the transaction category.
          example: 0.02
        overdueRateAfterDueDate:
          type: number
          description: The overdue rate after the due date.
          example: 0.03
        minimumValue:
          type: number
          description: The minimum value for the transaction category.
          example: 1000
        chargeOrder:
          type: number
          description: The order in which the charge is applied.
          example: 1
        npaChargeOrder:
          type: number
          description: The order in which the NPA charge is applied.
          example: 2
