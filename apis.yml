name: Falcon
description: 'Falcon (Falcon Financial Services, falconfs.com) is a global embedded-finance
  and Banking-as-a-Service platform that lets fintechs, banks, and enterprises launch credit
  and payment products in days rather than months. Its developer-first REST APIs and no-code
  tooling cover the full issuance and lending lifecycle: issuer and program onboarding,
  enterprise and user KYC, credit-card issuance (virtual, physical, add-on, co-branded,
  corporate), accounts and credit limits, transactions, statements, repayments and
  auto-debit, EMI conversion and amortisation, disputes, rewards, interest, fees, funding,
  and reconciliations. Falcon holds its own lending and issuance licenses, is built on a
  modular multi-tenant architecture, and is certified against PCI DSS, ISO 27001:2022, and
  SOC 2. Product lines include Falcon CardFX (issuance), CreditFX (lending), WalletFX
  (prepaid/wallets), and SurgeFX (AI growth and portfolio tools).'
